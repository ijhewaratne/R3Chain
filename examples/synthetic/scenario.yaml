networks:
  - network_id: syn-network
    version: "1"
    dataset_id: syn-definitions
    heat_carrier: hot_water
    fluid: {name: water, property_model: incompressible}
    vertical_datum: DHHN2016
    nodes:
      - {node_id: s0, circuit: supply, elevation_m: 160, zone_id: zone-main}
      - {node_id: s1, circuit: supply, elevation_m: 150, zone_id: zone-main}
      - {node_id: s2, circuit: supply, elevation_m: 175, zone_id: zone-main}
      - {node_id: s3, circuit: supply, elevation_m: 195, zone_id: zone-main}
      - {node_id: s4, circuit: supply, elevation_m: 210, zone_id: zone-main}
      - {node_id: r0, circuit: return, elevation_m: 160, zone_id: zone-main}
      - {node_id: r1, circuit: return, elevation_m: 150, zone_id: zone-main}
      - {node_id: r2, circuit: return, elevation_m: 175, zone_id: zone-main}
      - {node_id: r3, circuit: return, elevation_m: 195, zone_id: zone-main}
      - {node_id: r4, circuit: return, elevation_m: 210, zone_id: zone-main}
    pipes:
      - {pipe_id: supply-0-1, from_node: s0, to_node: s1, length_m: 400, inner_diameter_m: 0.2, roughness_m: 0.0001, heat_transfer_coefficient_w_m2_k: 0.6}
      - {pipe_id: supply-1-2, from_node: s1, to_node: s2, length_m: 600, inner_diameter_m: 0.2, roughness_m: 0.0001, heat_transfer_coefficient_w_m2_k: 0.6}
      - {pipe_id: supply-2-3, from_node: s2, to_node: s3, length_m: 500, inner_diameter_m: 0.15, roughness_m: 0.0001, heat_transfer_coefficient_w_m2_k: 0.6, estimated_fields: [roughness_m]}
