# Synthetic study, milestone M1 version.
#
# Every value in this file is invented for software development and testing. Nothing here
# describes Wuppertal, WSW assets or any real site. See definitions.md.
#
# Each engineering input states whether it is known (with its provenance), unknown (with the
# person expected to resolve it) or in conflict.

scenario_id: synthetic-study

study:
  study_id: synthetic-study
  project_id: r3chain
  title: Synthetic four consumer study
  objective: Exercise every part of the evaluation chain with invented data
  study_area:
    crs: "EPSG:25832"
    geojson:
      type: Polygon
      coordinates: [[[500000, 5700000], [506000, 5700000], [506000, 5704000], [500000, 5704000], [500000, 5700000]]]
  planning_date: 2026-11-15
  baseline_id: baseline-existing
  synthetic: true

alternatives:
  - alternative_id: baseline-existing
    label: Existing supply without geothermal heat
  - alternative_id: geothermal-direct
    label: Geothermal heat through a direct exchanger
  - alternative_id: geothermal-heat-pump
    label: Geothermal heat with heat pump assistance

datasets:
  - dataset_id: syn-definitions
    version: "2"
    kind: definitions
    title: Definitions of the synthetic study
    source_uri: definitions.md
    checksum: "sha256:4647771c15a08f63db6f22eea0611c0d99c86fd0311a62334cd7b7e7ce8cb925"
    owner: R3CHAIN development
    acquired_at: 2026-11-15T00:00:00Z
    allowed_use: public
    access_group: public
    quality: unreviewed
    quality_note: Invented values. Not evidence about any real site.
    synthetic: true

policies:
