      - {consumer_id: consumer-2, supply_node: s2, return_node: r2, design_heat_w: 1200000}
      - {consumer_id: consumer-3, supply_node: s3, return_node: r3, design_heat_w: 600000}
      - {consumer_id: consumer-4, supply_node: s4, return_node: r4, design_heat_w: 400000}
