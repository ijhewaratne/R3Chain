# --- network ----------------------------------------------------------------------------------

networks:
  - network_id: syn-network
    version: "1"
    dataset_id: syn-definitions
    heat_carrier: hot_water
    fluid: {name: water, property_model: incompressible}
    vertical_datum: DHHN2016
    nodes:
      - {node_id: s0, circuit: supply, elevation_m: 160, zone_id: zone-main}
      - {node_id: s1, circuit: supply, elevation_m: 150, zone_id: zone-main}
      - {node_id: s2, circuit: supply, elevation_m: 175, zone_id: zone-main}
      - {node_id: s3, circuit: supply, elevation_m: 195, zone_id: zone-main}
      - {node_id: s4, circuit: supply, elevation_m: 210, zone_id: zone-main}
      - {node_id: r0, circuit: return, elevation_m: 160, zone_id: zone-main}
      - {node_id: r1, circuit: return, elevation_m: 150, zone_id: zone-main}
      - {node_id: r2, circuit: return, elevation_m: 175, zone_id: zone-main}
      - {node_id: r3, circuit: return, elevation_m: 195, zone_id: zone-main}
      - {node_id: r4, circuit: return, elevation_m: 210, zone_id: zone-main}
    pipes:
      - {pipe_id: supply-0-1, from_node: s0, to_node: s1, length_m: 400, inner_diameter_m: 0.2, roughness_m: 0.0001, heat_transfer_coefficient_w_m2_k: 0.6}
      - {pipe_id: supply-1-2, from_node: s1, to_node: s2, length_m: 600, inner_diameter_m: 0.2, roughness_m: 0.0001, heat_transfer_coefficient_w_m2_k: 0.6}
      - {pipe_id: supply-2-3, from_node: s2, to_node: s3, length_m: 500, inner_diameter_m: 0.15, roughness_m: 0.0001, heat_transfer_coefficient_w_m2_k: 0.6, estimated_fields: [roughness_m]}
      - {pipe_id: supply-3-4, from_node: s3, to_node: s4, length_m: 450, inner_diameter_m: 0.15, roughness_m: 0.0001, heat_transfer_coefficient_w_m2_k: 0.6}
      - {pipe_id: return-1-0, from_node: r1, to_node: r0, length_m: 400, inner_diameter_m: 0.2, roughness_m: 0.0001, heat_transfer_coefficient_w_m2_k: 0.6}
      - {pipe_id: return-2-1, from_node: r2, to_node: r1, length_m: 600, inner_diameter_m: 0.2, roughness_m: 0.0001, heat_transfer_coefficient_w_m2_k: 0.6}
      - {pipe_id: return-3-2, from_node: r3, to_node: r2, length_m: 500, inner_diameter_m: 0.15, roughness_m: 0.0001, heat_transfer_coefficient_w_m2_k: 0.6, estimated_fields: [roughness_m]}
      - {pipe_id: return-4-3, from_node: r4, to_node: r3, length_m: 450, inner_diameter_m: 0.15, roughness_m: 0.0001, heat_transfer_coefficient_w_m2_k: 0.6}
    consumers:
      - {consumer_id: consumer-1, supply_node: s1, return_node: r1, design_heat_w: 800000}
      - {consumer_id: consumer-2, supply_node: s2, return_node: r2, design_heat_w: 1200000}
      - {consumer_id: consumer-3, supply_node: s3, return_node: r3, design_heat_w: 600000}
      - {consumer_id: consumer-4, supply_node: s4, return_node: r4, design_heat_w: 400000}
    boundary_conditions:
      - boundary_id: pressure-reference
        node_id: r0
        kind: pressure_reference
        pressure: {value_pa: 750000, reference: absolute}

connections:
