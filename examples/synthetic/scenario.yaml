# --- uncertainty ------------------------------------------------------------------------------

uncertainty_models:
  - uncertainty_model_id: uncertainty-base
    variables:
      - variable_id: alpha-reservoir-temperature
        field_path: "well_scenarios[source-alpha].reservoir_parameters[reservoir_temperature_k]"
        unit: K
        kind: scenario_set
        scenario_values: [368.15, 378.15, 388.15]
        support: {lower: 358.15, upper: 398.15}
        evidence: &uncertainty {provenance_type: synthetic, source_id: syn-definitions, locator: "section 6"}
      - variable_id: discount-rate
        field_path: "economic_scenarios[econ-base].discount_rate_per_year"
        unit: "1/a"
        kind: scenario_set
        scenario_values: [0.03, 0.04, 0.06]
        support: {lower: 0.0, upper: 0.1}
        evidence: *uncertainty
    success_definition:
      state: unknown
      reason: The geological success event has not been defined
      owner: AP1 to AP3 specialists (open decision O05)
