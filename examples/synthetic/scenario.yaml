# --- plants -----------------------------------------------------------------------------------
#
# Three integration concepts. The arrangement names an entry of the plant registry. Which
# parameters an arrangement needs is declared there.

plants:
  - plant_id: plant-direct
    arrangement: direct_exchanger
    description: One counterflow exchanger between the geothermal circuit and the network
    parameters:
      exchanger_ua_w_k: {state: known, value: 450000, provenance: &plant {provenance_type: synthetic, source_id: syn-definitions, locator: "section 7"}}
      exchanger_min_approach_delta_k: {state: known, value: 5, provenance: *plant}
      exchanger_fouling_allowance_fraction: {state: known, value: 0.1, provenance: *plant}
      geothermal_side_rated_pressure_loss_pa: {state: known, value: 60000, provenance: *plant}
      geothermal_side_rated_mass_flow_kg_s: {state: known, value: 15, provenance: *plant}
      max_geothermal_side_pressure_loss_pa: {state: known, value: 100000, provenance: *plant}
      network_side_rated_pressure_loss_pa:
        state: unknown
        reason: No exchanger has been selected, so its network side pressure loss is not known
        owner: Plant designer
      network_side_rated_mass_flow_kg_s:
        state: unknown
        reason: No exchanger has been selected, so its network side rated flow is not known
        owner: Plant designer

  - plant_id: plant-heat-pump
    arrangement: heat_pump_assisted
    description: >-
      A direct exchanger heats the network return. A heat pump lifts it to the supply
      temperature, with its evaporator on the geothermal stream after the exchanger
    parameters:
      exchanger_ua_w_k: {state: known, value: 450000, provenance: *plant}
      exchanger_min_approach_delta_k: {state: known, value: 5, provenance: *plant}
      exchanger_fouling_allowance_fraction: {state: known, value: 0.1, provenance: *plant}
      min_geothermal_outlet_temperature_k: {state: known, value: 303.15, provenance: *plant}
      compressor_heat_loss_fraction: {state: known, value: 0.05, provenance: *plant}
    heat_pump_map:
      state: known
      provenance: *plant
      value:
        map_id: synthetic-heat-pump
        description: Invented performance map. Not a product and not manufacturer data
        source_inlet_temperatures_k: [303.15, 318.15, 333.15, 348.15]
        sink_outlet_temperatures_k: [333.15, 343.15, 353.15, 363.15]
        heating_cop_ratio:
          - [4.6, 3.9, 3.4, 3.0]
          - [6.0, 4.9, 4.1, 3.5]
          - [8.2, 6.2, 5.0, 4.2]
          - [9.5, 8.0, 6.3, 5.1]
        max_condenser_heat_w:
          - [1000000, 950000, 900000, 850000]
          - [1200000, 1150000, 1100000, 1050000]
          - [1400000, 1350000, 1300000, 1250000]
          - [1500000, 1450000, 1400000, 1350000]

  - plant_id: plant-separated
    arrangement: pressure_separation_exchanger
    description: >-
      Two exchangers in series through an intermediate loop. The second one separates the
      pressure zone of the network from the plant
    parameters:
      exchanger_ua_w_k: {state: known, value: 450000, provenance: *plant}
      exchanger_min_approach_delta_k: {state: known, value: 5, provenance: *plant}
      exchanger_fouling_allowance_fraction: {state: known, value: 0.1, provenance: *plant}
      separation_exchanger_ua_w_k: {state: known, value: 600000, provenance: *plant}
      separation_exchanger_min_approach_delta_k: {state: known, value: 3, provenance: *plant}

