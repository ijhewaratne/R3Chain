  # --- acceptance tests -----------------------------------------------------------------------
  - id: A01
    kind: acceptance
    statement: >-
      Known heat balance. An independent enthalpy or reviewed heat capacity calculation agrees
      within the numerical policy
    milestone: M2
    lands_in: [coupling]
    status: built
    tests:
      - test_exchanger_energy_balance_closes
      - test_enthalpy_of_tabulated_heat_capacity_matches_numerical_integration
      - test_exchanger_balance_closes_on_enthalpy_with_a_temperature_dependent_fluid
      - test_coupled_heat_balance_agrees_with_independent_calculations
  - id: A02
    kind: acceptance
    statement: >-
      Exchanger terminal limit. An inadequate approach temperature fails direct heat with the
      specific limiting terminal
    milestone: M2
    lands_in: [coupling]
    status: built
    tests:
      - test_terminal_checks_name_the_failing_end
      - test_a_source_that_is_too_cold_fails_at_the_hot_end_only
      - test_inadequate_hot_end_approach_fails_direct_heat_with_its_terminal
  - id: A03
    kind: acceptance
    statement: >-
      Heat pump balance. Condenser heat equals evaporator heat plus compressor input under the
      stated loss model
    milestone: M2
    lands_in: [coupling]
    status: built
    tests:
      - test_heat_pump_balance_closes_under_the_stated_loss_model
