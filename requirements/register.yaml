  # --- acceptance tests -----------------------------------------------------------------------
  - id: A01
    kind: acceptance
    statement: >-
      Known heat balance. An independent enthalpy or reviewed heat capacity calculation agrees
      within the numerical policy
    milestone: M2
    lands_in: [coupling]
    status: partial
    tests: [test_exchanger_energy_balance_closes]
  - id: A02
    kind: acceptance
    statement: >-
      Exchanger terminal limit. An inadequate approach temperature fails direct heat with the
      specific limiting terminal
    milestone: M2
    lands_in: [coupling]
    status: planned
    tests: []
  - id: A03
    kind: acceptance
    statement: >-
      Heat pump balance. Condenser heat equals evaporator heat plus compressor input under the
      stated loss model
    milestone: M2
    lands_in: [coupling]
    status: planned
    tests: []
  - id: A04
    kind: acceptance
    statement: >-
      Elevation and pressure. Local pressure reflects the height change, and static head is not
      double counted as closed loop circulation demand
    milestone: M1
    lands_in: [adapters, reference]
    status: built
    tests:
      - test_hydrostatic_pressure_difference
      - test_static_head_cancels_around_a_closed_loop
      - test_elevation_changes_local_pressure_but_not_the_flows
  - id: A05
    kind: acceptance
    statement: >-
      Finite source capacity. An undersized source leaves a reported deficit or uses an explicit
      backup source
    milestone: M2
    lands_in: [coupling]
    status: planned
    tests: []
  - id: A06
    kind: acceptance
    statement: >-
      Zero or reversed flow. Validated behaviour or a specific unsupported or numerical state,
      and no silent NaN based ranking
    milestone: M1
    lands_in: [adapters]
    status: built
    tests:
      - test_a_branch_without_flow_has_no_temperature
      - test_a_network_without_any_flow_is_reported_as_such
      - test_reversed_flow_through_a_consumer_is_refused
  - id: A07
    kind: acceptance
    statement: >-
      Demand and time basis. Interval integration, leap years and daylight saving handling
      produce correct totals
    milestone: M4
    lands_in: [domain, operation]
    status: partial
    tests:
      - test_annual_energy_uses_actual_intervals
      - test_daylight_saving_days_have_23_and_25_hours
      - test_repeated_local_hour_is_resolved
  - id: A08
    kind: acceptance
    statement: >-
      Existing base load. Geothermal useful heat and cost change when a competing source covers
      summer demand
    milestone: M4
    lands_in: [operation]
    status: planned
    tests: []
  - id: A09
    kind: acceptance
    statement: >-
      Cost reconciliation. Each well, pump, exchanger and route item appears once on the chosen
      boundary
    milestone: M4
    lands_in: [economics]
    status: partial
    tests: [test_duplicate_cost_ownership_is_rejected]
  - id: A10
    kind: acceptance
    statement: >-
      Discounting. Independent constant and variable cash flow fixtures agree, and zero discount
      rate and zero heat are handled
    milestone: M4
    lands_in: [economics]
    status: partial
    tests:
      - test_capital_recovery_factor_matches_annuity_sum
      - test_capital_recovery_factor_at_zero_rate
      - test_variable_cash_flow_lcoh_by_hand
      - test_lcoh_is_undefined_without_heat
  - id: A11
    kind: acceptance
    statement: >-
      Connection alternatives. Site and connection are jointly identified and ranked, and the
      shortest distance is not assumed cheapest
    milestone: M3
    lands_in: [search]
    status: planned
    tests: []
  - id: A12
    kind: acceptance
    statement: >-
      Data gaps. Missing operating limits or permit evidence remain visible and do not become a
      positive check
    milestone: M3
    lands_in: [domain, geospatial]
    status: partial
    tests:
      - test_unknown_input_is_never_defaulted
      - test_a_missing_input_gives_no_number
      - test_an_unknown_required_input_stops_the_request
      - test_an_unknown_source_input_is_reported_and_not_defaulted
  - id: A13
    kind: acceptance
    statement: >-
      Failure categories. Nonconvergence remains distinct from an infeasible resource or network
    milestone: M2
    lands_in: [domain, adapters, coupling]
    status: partial
    tests:
      - test_non_convergence_is_not_a_technical_failure
      - test_a_numerical_failure_is_not_a_physical_one
      - test_non_convergence_and_a_pressure_limit_are_different_outcomes
  - id: A14
    kind: acceptance
    statement: >-
      Uncertainty. A repeated seed and model versions reproduce samples, and the denominator and
      unresolved runs are correct
    milestone: M5
    lands_in: [uncertainty]
    status: planned
    tests: []
  - id: A15
    kind: acceptance
    statement: >-
      Scenario correction. Changing a dependent assumption invalidates stale results and produces
      a visible revision
    milestone: M6
    lands_in: [pipeline, store, services]
    status: partial
    tests:
      - test_changed_input_recomputes_dependent_stages
      - test_variant_creates_revision_with_change_record
      - test_only_the_stage_that_depends_on_a_change_is_recomputed
  - id: A16
    kind: acceptance
    statement: >-
      Access and export. A user cannot retrieve unauthorised evidence through chat, runs, cache
      or report export
    milestone: M6
    lands_in: [services]
    status: planned
    tests: []
  - id: A17
    kind: acceptance
    statement: Replay. A report's frozen inputs reproduce its result without the assistant
    milestone: M6
    lands_in: [pipeline, reporting]
    status: partial
    tests: [test_replay_is_identical]
  - id: A18
    kind: acceptance
    statement: >-
      Pilot baseline. Observed baseline fit and limitations meet criteria agreed with WSW for the
      intended decision
    milestone: M8
    lands_in: [adapters, docs]
    status: planned
    tests: []
