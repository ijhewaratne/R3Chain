# Requirements register.
#
# One entry per workshop requirement (W), open decision (O, D), acceptance test (A), plan item
# (V), and experiment (E) of the implementation specification and plan v2. New requirements are
# added here first, classified, and tied to a test before code is written (plan section 4.4).
#
# status for W, A, V, and E entries:  planned | partial | built | verified | superseded
#   partial  = part of it exists and the listed tests pass. The milestone says when it is complete.
# status for O and D entries:        open | resolved
#
# A W entry is workshop evidence. It is not a formally accepted requirement.

schema_version: "0.1.0"

