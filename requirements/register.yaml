# Requirements register.
#
# One entry per workshop requirement (W), open decision (O) and acceptance test (A) of the
# implementation specification v1.0. New requirements are added here first, classified, and tied
# to a test before code is written (implementation plan section 4.4).
#
# status for W and A entries:  planned | partial | built | verified | superseded
#   partial  = part of it exists and the listed tests pass. The milestone says when it is complete.
# status for O entries:        open | resolved
#
# A W entry is workshop evidence. It is not a formally accepted requirement.

schema_version: "0.1.0"

