[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "r3chain"
version = "0.1.0"
description = "R3CHAIN geothermal planning system: coupled site, source, network and economic evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0",
  # Geometry, coordinate reference systems and route graphs (milestone M3).
  "shapely>=2.0",
  "pyproj>=3.6",
  "networkx>=3.2",
]

[project.optional-dependencies]
# The network engine. The adapter in r3chain.adapters.pandapipes_network is written against
# exactly this release. Change the pin only together with the adapter and its tests.
network = [
  "pandapipes==0.17.0",
]
# Readers for GIS files: GeoPackage, GeoParquet and GeoJSON.
gis = [
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "pyarrow>=15",
]
# Application services HTTP API and MCP server (milestone M6 step 6.1).
service = [
  "fastapi>=0.163.2,<1",
  "uvicorn>=0.54.0,<1",
  "mcp>=2.3.0,<3",
]
dev = [
  "pandapipes==0.17.0",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "pyarrow>=15",
  "fastapi>=0.163.2,<1",
  "uvicorn>=0.54.0,<1",
  "mcp>=2.3.0,<3",
  "httpx>=0.28.1,<1",
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-shapely",
  "types-networkx",
]

[project.scripts]
r3chain = "r3chain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/r3chain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "requirement(id): links a test to an entry in requirements/register.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/r3chain"]

[[tool.mypy.overrides]]
module = [
  "pandapipes",
  "pandapipes.*",
  "geopandas",
  "geopandas.*",
  "pyogrio",
  "pyogrio.*",
  "pandas",
  "pandas.*",
  "pyarrow",
  "pyarrow.*",
  "scipy",
  "scipy.*",
]
ignore_missing_imports = true
follow_imports = "skip"
